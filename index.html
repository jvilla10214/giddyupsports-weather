<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GiddyUpSports Weather Command Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  /* ---------- Design tokens: dark ("stadium at night") is the default identity ---------- */
  :root {
    --bg: #0a1420;
    --bg-elevated: #101d2e;
    --bg-elevated-2: #16273c;
    --bg-glass: rgba(16, 29, 46, 0.78);
    --text: #eef3f8;
    --text-muted: #93a5b8;
    --text-faint: #5f7086;
    --line: rgba(255, 255, 255, 0.09);
    --line-strong: rgba(255, 255, 255, 0.18);

    --accent-atmo: #6fd7ff;      /* wind / weather data */
    --accent-atmo-dim: #16384a;
    --accent-live: #3ecf82;      /* favorable / live status */
    --accent-live-dim: #143c29;
    --accent-ai: #ffb648;        /* AI-generated content marker only */
    --accent-ai-dim: #4a3418;
    --accent-warn: #ff6b5b;      /* unfavorable / severe */
    --accent-warn-dim: #4a2119;

    --shadow: 0 20px 60px -22px rgba(0, 0, 0, 0.65);
    --shadow-soft: 0 12px 32px -18px rgba(0, 0, 0, 0.55);

    --font-display: "Big Shoulders Display", system-ui, sans-serif;
    --font-body: "Manrope", system-ui, -apple-system, sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", monospace;
  }

  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f2f5f8;
      --bg-elevated: #ffffff;
      --bg-elevated-2: #e9eef3;
      --bg-glass: rgba(255, 255, 255, 0.82);
      --text: #0f1e2e;
      --text-muted: #52667a;
      --text-faint: #8497aa;
      --line: rgba(15, 30, 46, 0.1);
      --line-strong: rgba(15, 30, 46, 0.18);

      --accent-atmo: #0e8aa3;
      --accent-atmo-dim: #d7eef3;
      --accent-live: #1f8a52;
      --accent-live-dim: #dcf1e5;
      --accent-ai: #b96d0e;
      --accent-ai-dim: #fbe8cf;
      --accent-warn: #c8392b;
      --accent-warn-dim: #fbe0dd;

      --shadow: 0 20px 50px -26px rgba(15, 30, 46, 0.22);
      --shadow-soft: 0 10px 26px -18px rgba(15, 30, 46, 0.16);
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  button, select { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent-atmo); outline-offset: 2px; }

  /* Ambient wind-flow layer: sits behind everything, drifting arrows across the whole page —
     never over the stadium picture, which stays clean per the design brief. */
  .wind-flow-canvas {
    position: fixed;
    inset: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 0;
    opacity: 0.6;
  }

  .page {
    position: relative;
    z-index: 1;
    max-width: 1120px;
    margin: 0 auto;
    padding: clamp(16px, 4vw, 40px);
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  /* ---------- Masthead ---------- */
  .masthead { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 12px; }

  /* Logo mark: a ruler/tape-measure pill frame around a wordmark, recolored via currentColor
     so it automatically matches the active theme (dark: near-white, light: near-black). */
  .brand-logo {
    position: relative;
    display: inline-flex;
    align-items: center;
    color: var(--text);
    border: 2px solid currentColor;
    border-radius: 100px;
    padding: 9px 22px;
  }
  .brand-logo::before,
  .brand-logo::after {
    content: "";
    position: absolute;
    left: 16px; right: 16px;
    height: 5px;
    background-image: repeating-linear-gradient(90deg, currentColor 0 1.5px, transparent 1.5px 9px);
    opacity: 0.5;
  }
  .brand-logo::before { top: 3px; }
  .brand-logo::after { bottom: 3px; }
  .brand-logo .wordmark {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 1.3rem;
    letter-spacing: 0.01em;
    text-transform: uppercase;
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
    gap: 0.05em;
  }
  .brand-logo .ball { flex: none; transform: translateY(-0.02em); }
  .brand .kicker {
    font-family: var(--font-mono);
    font-size: 0.65rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-faint);
    white-space: nowrap;
  }

  .sport-toggle {
    display: inline-flex;
    background: var(--bg-elevated);
    border: 1px solid var(--line);
    border-radius: 100px;
    padding: 4px;
    gap: 2px;
    margin-left: auto;
    flex-wrap: wrap;
  }
  .sport-toggle button {
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 0.8rem;
    border: none;
    background: transparent;
    color: var(--text-muted);
    padding: 8px 16px;
    border-radius: 100px;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .sport-toggle button[aria-pressed="true"] { background: var(--accent-live-dim); color: var(--accent-live); }
  .sport-toggle button:disabled { color: var(--text-faint); cursor: default; opacity: 0.5; }
  .sport-toggle button:not(:disabled):not([aria-pressed="true"]):hover { color: var(--text); }

  .game-picker {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--bg-elevated);
    border: 1px solid var(--line);
    padding: 6px 8px 6px 16px;
    border-radius: 100px;
  }
  .game-picker svg.gp-icon { flex: none; stroke: var(--text-faint); }
  .game-picker select {
    appearance: none;
    -webkit-appearance: none;
    border: none;
    background: transparent;
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 0.82rem;
    flex: 1;
    padding: 8px 4px;
    cursor: pointer;
  }
  .game-picker select:disabled { color: var(--text-faint); cursor: default; }
  .game-picker select option { background: var(--bg-elevated); color: var(--text); }
  .game-picker svg.gp-chev { flex: none; stroke: var(--text-faint); margin-right: 6px; }

  /* ---------- Empty state ---------- */
  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    padding: 90px 20px;
    color: var(--text-muted);
    text-align: center;
  }
  .empty-state .icon-ring {
    width: 56px; height: 56px;
    border-radius: 50%;
    background: var(--bg-elevated);
    border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center;
  }
  .empty-state .icon-ring svg { stroke: var(--accent-atmo); }
  .empty-state p { margin: 0; font-size: 0.95rem; }

  /* ---------- Venue heading ---------- */
  .venue-heading { display: flex; flex-direction: column; gap: 2px; }
  .venue-heading .name {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: clamp(1.4rem, 2.6vw, 2rem);
    text-transform: uppercase;
    letter-spacing: 0.01em;
    text-wrap: balance;
  }
  .venue-heading .meta {
    font-family: var(--font-mono);
    font-size: 0.78rem;
    color: var(--text-muted);
  }

  /* ---------- Hero: a static, centered, non-interactive picture — nothing overlays it ---------- */
  .hero {
    position: relative;
    border-radius: 22px;
    overflow: hidden;
    border: 1px solid var(--line);
    box-shadow: var(--shadow);
    height: clamp(340px, 42vw, 540px);
    background: var(--bg-elevated);
  }
  #map { position: absolute; inset: 0; cursor: default !important; }
  #map .leaflet-marker-icon,
  #map .leaflet-marker-shadow { cursor: default !important; }

  /* ---------- Insight panel: a plain card below the picture, not an overlay on it ---------- */
  .insight-panel {
    background: var(--bg-elevated);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 18px 20px;
    box-shadow: var(--shadow-soft);
  }
  .insight-top { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; min-height: 22px; }
  .pill-ai {
    font-family: var(--font-mono);
    font-size: 0.6rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--accent-ai); background: var(--accent-ai-dim);
    border-radius: 100px; padding: 4px 10px;
  }
  .pill-lean {
    font-family: var(--font-body); font-size: 0.78rem; font-weight: 700;
    border-radius: 100px; padding: 4px 12px;
  }
  .pill-lean.good { color: var(--accent-live); background: var(--accent-live-dim); }
  .pill-lean.info { color: var(--accent-atmo); background: var(--accent-atmo-dim); }
  .pill-lean.warn { color: var(--accent-ai); background: var(--accent-ai-dim); }
  .pill-lean.bad { color: var(--accent-warn); background: var(--accent-warn-dim); }
  .pill-lean.neutral { color: var(--text-muted); background: var(--bg-elevated-2); }
  .insight-zone { font-size: 0.78rem; color: var(--text-muted); }
  .insight-text { font-size: 0.94rem; line-height: 1.55; color: var(--text); max-width: 64ch; }

  /* ---------- Stat chips ---------- */
  .stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; min-height: 8px; }
  @media (max-width: 760px) { .stats { grid-template-columns: repeat(2, 1fr); } }

  .chip {
    background: var(--bg-elevated);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 14px 16px;
    display: flex; flex-direction: column; gap: 8px;
    box-shadow: var(--shadow-soft);
  }
  .chip .icon-wrap {
    width: 30px; height: 30px; border-radius: 9px;
    display: flex; align-items: center; justify-content: center;
    background: var(--accent-atmo-dim);
  }
  .chip .icon-wrap svg { stroke: var(--accent-atmo); }
  .chip.live .icon-wrap { background: var(--accent-live-dim); }
  .chip.live .icon-wrap svg { stroke: var(--accent-live); }
  .chip .label { font-family: var(--font-mono); font-size: 0.64rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-faint); }
  .chip .value { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 1.4rem; font-weight: 600; color: var(--text); line-height: 1; }
  .chip .value small { font-size: 0.8rem; color: var(--text-muted); font-weight: 500; margin-left: 2px; }

  footer {
    display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;
    padding-top: 8px;
    font-size: 0.76rem;
    color: var(--text-faint);
    border-top: 1px solid var(--line);
    margin-top: 8px;
  }
  footer .status { font-family: var(--font-mono); font-size: 0.72rem; color: var(--text-muted); white-space: nowrap; }
</style>
</head>
<body>

<canvas id="windFlowCanvas" class="wind-flow-canvas"></canvas>

<div class="page">

  <div class="masthead">
    <div class="brand">
      <div class="brand-logo">
        <span class="wordmark">
          GiddyUpSp
          <svg class="ball" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <circle cx="12" cy="12" r="9.5" />
            <path d="M6.2 4.2c2.4 4 2.4 11.6 0 15.6" stroke-linecap="round" />
            <path d="M17.8 4.2c-2.4 4-2.4 11.6 0 15.6" stroke-linecap="round" />
          </svg>
          rts
        </span>
      </div>
      <span class="kicker">Weather Intelligence</span>
    </div>
    <div class="sport-toggle" id="sportToggle" role="group" aria-label="Sport">
      <button data-sport="mlb" aria-pressed="true">MLB</button>
      <button data-sport="nfl" aria-pressed="false">NFL</button>
      <button disabled title="Coming soon">NCAAF</button>
      <button disabled title="Coming soon">Tennis</button>
      <button disabled title="Coming soon">Golf</button>
    </div>
  </div>

  <div class="game-picker">
    <svg class="gp-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <select id="gameSelect" disabled>
      <option value="">Loading schedule…</option>
    </select>
    <svg class="gp-chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
  </div>

  <div id="emptyState" class="empty-state">
    <div class="icon-ring">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
    </div>
    <p>Pick a game above to see conditions and the AI read.</p>
  </div>

  <div id="gameView" style="display:none; flex-direction: column; gap: 16px;">
    <div class="venue-heading">
      <div class="name" id="venueTag">Loading venue…</div>
      <div class="meta" id="venueMeta"></div>
    </div>

    <div class="hero" id="heroCard">
      <div id="map"></div>
    </div>

    <div class="insight-panel">
      <div class="insight-top" id="insightTop"></div>
      <div class="insight-text" id="insightText">Loading AI read…</div>
    </div>

    <div class="stats" id="dataStrip"></div>
  </div>

  <footer>
    <span>Data from MLB Stats API, ESPN, and Open-Meteo. Insights are AI-narrated readings of a deterministic physics model, not betting advice.</span>
    <span class="status" id="statusLine"></span>
  </footer>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  // Point this at your deployed Worker. Falls back to localhost for `wrangler dev` testing.
  const WORKER_BASE = (location.hostname === "localhost" || location.hostname === "127.0.0.1")
    ? "http://localhost:8787"
    : "https://giddyupsports-weather.giddyupsports.workers.dev";

  const sportToggle = document.getElementById("sportToggle");
  const gameSelect = document.getElementById("gameSelect");
  const statusLine = document.getElementById("statusLine");
  const emptyState = document.getElementById("emptyState");
  const gameView = document.getElementById("gameView");
  const venueTag = document.getElementById("venueTag");
  const dataStrip = document.getElementById("dataStrip");
  const insightText = document.getElementById("insightText");
  const insightTop = document.getElementById("insightTop");
  const venueMeta = document.getElementById("venueMeta");

  let map, marker;
  let currentGames = [];
  let currentSport = "mlb";

  function setStatus(msg) { statusLine.textContent = msg || ""; }

  // ---- Ambient wind-flow: arrows drifting across the whole page, same technique as the
  // racing command center's track-wind visual (canvas particle streamlines), but here it runs
  // behind the page content rather than over a photo, so nothing ever covers the stadium picture.
  (function initWindFlow() {
    const canvas = document.getElementById("windFlowCanvas");
    const ctx = canvas.getContext("2d");
    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const PARTICLE_COUNT = 110;
    let particles = [];
    let flowAngleDeg = 200; // gentle ambient default until real wind data loads
    let flowSpeedMph = 6;
    let strokeRgb = "111,215,255";

    function hexToRgb(hex) {
      const m = hex.trim().match(/^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i);
      return m ? `${parseInt(m[1], 16)},${parseInt(m[2], 16)},${parseInt(m[3], 16)}` : "111,215,255";
    }
    function refreshColor() {
      strokeRgb = hexToRgb(getComputedStyle(document.documentElement).getPropertyValue("--accent-atmo"));
    }

    function resize() {
      const dpr = window.devicePixelRatio || 1;
      canvas.width = window.innerWidth * dpr;
      canvas.height = window.innerHeight * dpr;
      canvas.style.width = window.innerWidth + "px";
      canvas.style.height = window.innerHeight + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function flowVector(deg) {
      const rad = (deg * Math.PI) / 180;
      return { dx: Math.sin(rad), dy: -Math.cos(rad) };
    }

    function respawn(p) {
      p.x = Math.random() * window.innerWidth;
      p.y = Math.random() * window.innerHeight;
      p.trail = [];
      p.age = 0;
      p.maxAge = 140 + Math.random() * 160;
      p.variance = 0.75 + Math.random() * 0.5;
    }

    function seed() {
      particles = Array.from({ length: PARTICLE_COUNT }, () => {
        const p = {};
        respawn(p);
        p.age = Math.random() * p.maxAge; // stagger so they don't all respawn in sync
        return p;
      });
    }

    function step() {
      const { dx, dy } = flowVector(flowAngleDeg);
      const speedPx = 0.35 + Math.min(flowSpeedMph, 30) * 0.055;
      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
      for (const p of particles) {
        p.x += dx * speedPx * p.variance;
        p.y += dy * speedPx * p.variance;
        p.age++;
        p.trail.push({ x: p.x, y: p.y });
        if (p.trail.length > 14) p.trail.shift();
        if (p.age > p.maxAge || p.x < -40 || p.x > window.innerWidth + 40 || p.y < -40 || p.y > window.innerHeight + 40) {
          respawn(p);
          continue;
        }
        for (let i = 1; i < p.trail.length; i++) {
          const a = p.trail[i - 1];
          const b = p.trail[i];
          const alpha = (i / p.trail.length) * 0.4;
          ctx.strokeStyle = `rgba(${strokeRgb},${alpha})`;
          ctx.lineWidth = 1.2;
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.stroke();
        }
      }
    }

    function loop() {
      step();
      requestAnimationFrame(loop);
    }

    window.setWindFlow = function (dirFromDeg, speedMph) {
      flowAngleDeg = (dirFromDeg + 180) % 360; // flow shows where wind blows TOWARD
      flowSpeedMph = speedMph;
    };

    refreshColor();
    resize();
    seed();
    window.addEventListener("resize", resize);
    matchMedia("(prefers-color-scheme: light)").addEventListener("change", refreshColor);

    if (reduceMotion) {
      for (let i = 0; i < 6; i++) step();
    } else {
      loop();
    }
  })();

  const ICONS = {
    temp: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M14 14.76V3.5a2.5 2.5 0 0 0-5 0v11.26a4.5 4.5 0 1 0 5 0Z"/></svg>',
    humidity: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M12 2.7s6 7.2 6 11.3a6 6 0 0 1-12 0c0-4.1 6-11.3 6-11.3Z"/></svg>',
    wind: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M3 8h11a3 3 0 1 0-3-3M3 16h15a3 3 0 1 1-3 3M3 12h9"/></svg>',
    altitude: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="m8 21 4-13 4 13M3 21h18M9 8l3-5 3 5"/></svg>',
    carry: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M3 17l6-6 4 4 8-8M21 7v6h-6"/></svg>',
    roof: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M3 11 12 4l9 7M5 10v10h14V10"/></svg>',
    gauge: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M12 12 16 8M4 12a8 8 0 1 1 16 0"/></svg>',
  };

  function chip(icon, label, value, unit, live) {
    return `<div class="chip${live ? " live" : ""}">
      <div class="icon-wrap">${ICONS[icon]}</div>
      <div class="label">${label}</div>
      <div class="value">${value}${unit ? `<small>${unit}</small>` : ""}</div>
    </div>`;
  }

  // ESPN's scoreboard API allows browser CORS requests (Access-Control-Allow-Origin: *) but
  // blocks Cloudflare Worker IPs outright — confirmed by testing identical requests. So NFL
  // schedule is fetched straight from the browser instead of proxied through the Worker; MLB
  // still goes through the Worker since the official MLB Stats API has no such restriction.
  async function fetchNflScheduleClientSide() {
    const res = await fetch("https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard");
    if (!res.ok) throw new Error(`ESPN scoreboard API ${res.status}`);
    const data = await res.json();
    return (data.events || []).map((ev) => {
      const comp = ev.competitions?.[0];
      const home = comp?.competitors?.find((c) => c.homeAway === "home");
      const away = comp?.competitors?.find((c) => c.homeAway === "away");
      return {
        gameId: ev.id,
        startTimeUtc: ev.date,
        away: away?.team?.displayName,
        home: home?.team?.displayName,
        venue: comp?.venue?.fullName,
        venueKey: home?.team?.abbreviation || null,
        status: ev.status?.type?.description,
      };
    });
  }

  async function loadSchedule(sport) {
    currentSport = sport;
    gameSelect.disabled = true;
    gameSelect.innerHTML = '<option value="">Loading schedule…</option>';
    setStatus(`Fetching ${sport.toUpperCase()} schedule…`);
    try {
      let games;
      if (sport === "nfl") {
        games = await fetchNflScheduleClientSide();
      } else {
        const res = await fetch(`${WORKER_BASE}/api/schedule?sport=${sport}`);
        const data = await res.json();
        if (data.error) throw new Error(data.error);
        games = data.games || [];
      }
      currentGames = games.filter((g) => g.venueKey);
      if (!currentGames.length) {
        gameSelect.innerHTML = '<option value="">No games found for today</option>';
        setStatus("No games on the slate right now.");
        return;
      }
      gameSelect.innerHTML = currentGames
        .map((g, i) => {
          const time = new Date(g.startTimeUtc).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
          return `<option value="${i}">${g.away} @ ${g.home} — ${time}</option>`;
        })
        .join("");
      gameSelect.disabled = false;
      setStatus(`${currentGames.length} games loaded.`);
      loadGame(sport, currentGames[0]);
    } catch (err) {
      gameSelect.innerHTML = '<option value="">Failed to load schedule</option>';
      setStatus(`Error: ${err.message}`);
    }
  }

  function ensureMap(lat, lon) {
    if (!map) {
      // Fully static picture: every interaction handler off, so the stadium view can't be
      // panned or zoomed — it just shows the venue, centered, and nothing else.
      map = L.map("map", {
        zoomControl: false,
        attributionControl: false,
        dragging: false,
        scrollWheelZoom: false,
        doubleClickZoom: false,
        boxZoom: false,
        keyboard: false,
        touchZoom: false,
        tap: false,
      }).setView([lat, lon], 17);
      L.tileLayer(
        "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
        { maxZoom: 19 }
      ).addTo(map);
      marker = L.marker([lat, lon], { interactive: false }).addTo(map);
    } else {
      map.setView([lat, lon], 17);
      marker.setLatLng([lat, lon]);
    }
    setTimeout(() => map.invalidateSize(), 150);
  }

  function renderDataStrip(sport, weather, venue, score) {
    const chips = [
      chip("temp", "Temp", Math.round(weather.tempF), "°F"),
      chip("humidity", "Humidity", Math.round(weather.humidityPct), "%"),
      chip("wind", "Wind", weather.windSpeedMph.toFixed(1), `mph ${score.windCompass || ""}`),
    ];
    if (sport === "mlb") {
      chips.push(chip("altitude", "Altitude", (venue.altitudeFt / 1000).toFixed(1), "k ft"));
      chips.push(chip("carry", "Est. Carry", `${score.carryFt > 0 ? "+" : ""}${score.carryFt}`, "ft", true));
    } else {
      chips.push(chip("roof", "Roof", venue.roofType));
      chips.push(chip("gauge", "Wind Tier", score.windTier || "—", null, true));
    }
    dataStrip.innerHTML = chips.join("");
  }

  function renderLeanTop(sport, score) {
    let cls, label, zone;
    if (sport === "mlb") {
      cls = score.scoringLean === "hitter-friendly" ? "good" : score.scoringLean === "pitcher-friendly" ? "info" : "neutral";
      label = score.scoringLean.replace(/-/g, " ");
      zone = `wind ${score.windZone}`;
    } else {
      const tier = score.windTier || "";
      cls = tier === "light" ? "good" : tier === "moderate" ? "warn" : tier === "none (closed roof)" ? "neutral" : "bad";
      label = tier === "none (closed roof)" ? "roof closed" : `${tier} wind`;
      zone = score.passingImpact || "";
    }
    insightTop.innerHTML =
      `<span class="pill-ai">AI Insight</span>` +
      `<span class="pill-lean ${cls}">${label.replace(/\b\w/g, (c) => c.toUpperCase())}</span>` +
      `<span class="insight-zone">${zone}</span>`;
  }

  async function loadGame(sport, game) {
    emptyState.style.display = "none";
    gameView.style.display = "flex";
    venueTag.textContent = `${game.venue || "Venue"}…`;
    venueMeta.textContent = `${game.away} @ ${game.home}`;
    insightText.textContent = "Loading AI read…";
    insightTop.innerHTML = "";
    dataStrip.innerHTML = "";
    setStatus("Fetching conditions…");
    try {
      const res = await fetch(`${WORKER_BASE}/api/game?sport=${sport}&venueKey=${game.venueKey}`);
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      ensureMap(data.venue.lat, data.venue.lon);
      const suffix = sport === "mlb" ? `${data.venue.altitudeFt} ft elevation` : `${data.venue.roofType} roof`;
      venueTag.textContent = data.venue.venue;
      venueMeta.textContent = `${game.away} @ ${game.home} · ${suffix}`;
      renderDataStrip(sport, data.weather, data.venue, data.score);
      renderLeanTop(sport, data.score);
      insightText.textContent = data.insight || "No insight generated.";
      if (window.setWindFlow) window.setWindFlow(data.weather.windFromDeg || 0, data.weather.windSpeedMph || 0);
      setStatus(`Updated ${new Date().toLocaleTimeString()}`);
    } catch (err) {
      insightText.textContent = `Could not load conditions: ${err.message}`;
      setStatus(`Error: ${err.message}`);
    }
  }

  sportToggle.addEventListener("click", (e) => {
    const btn = e.target.closest("button");
    if (!btn || btn.disabled || btn.getAttribute("aria-pressed") === "true") return;
    sportToggle.querySelectorAll("button[data-sport]").forEach((b) => b.setAttribute("aria-pressed", String(b === btn)));
    loadSchedule(btn.dataset.sport);
  });

  gameSelect.addEventListener("change", () => {
    const g = currentGames[Number(gameSelect.value)];
    if (g) loadGame(currentSport, g);
  });

  loadSchedule(currentSport);
</script>
</body>
</html>
